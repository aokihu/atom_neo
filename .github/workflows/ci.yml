name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: Bun (typecheck, tests, build, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck workspaces
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build workspaces
        run: bun run build
      - name: Check docs links
        run: bun run docs:check
      - name: Typecheck docs
        run: bun run docs:typecheck

  node26:
    name: Node 26 (typecheck, smoke, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Node production sources
        run: bun run typecheck:node
      - name: Build Node artifact
        run: bun run build:node
      - name: Check Node build boundary
        run: node scripts/node-smoke/build.ts
      - name: Node smoke suite
        run: bun run smoke:node
      - name: Install tarball smoke
        run: bun run smoke:node:package
